<style>
/* Layout: an opening band with Jeton's bear, then nine numbered cards in a wrapping grid, the
   same numbers as the folders; the bear stories card spans the full width with the bears' photos. */
:root {
  --bg: #f7f2e7;          /* paper */
  --card: #fffdf8;
  --ink: #1d2a22;         /* dark forest ink, as in the documents */
  --muted: #5f6d62;
  --forest: #2f4a2c;      /* the project green */
  --cream: #f3e7cc;
  --accent: #c86a12;      /* the documents' orange, a little deeper */
  --line: #e2dccd;
  --display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --body: "Nunito", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a14; --card: #1a251c; --ink: #ece4d2; --muted: #a9b3a5; --forest: #a9c79a;
    --cream: #26352a; --accent: #f0a55a; --line: #2c3a2e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a14; --card: #1a251c; --ink: #ece4d2; --muted: #a9b3a5; --forest: #a9c79a;
  --cream: #26352a; --accent: #f0a55a; --line: #2c3a2e; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 1120px; margin: 0 auto; }
a { color: inherit; }
img { max-width: 100%; display: block; }

/* opening band */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(20px, 4vw, 56px);
  align-items: center; padding-block: clamp(28px, 6vw, 72px) clamp(24px, 4vw, 48px);
}
.eyebrow { font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
h1 {
  font-family: var(--display); font-weight: 700; margin: 0;
  font-size: clamp(44px, 8.5vw, 96px); line-height: .95; letter-spacing: -.01em; text-wrap: balance; color: var(--forest);
}
.sub { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2.6vw, 27px); margin: 14px 0 0; }
.lede { margin: 18px 0 0; max-width: 36em; color: var(--muted); }
.lede b { color: var(--ink); }
.art { margin: 0; }
.art img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; object-position: 78% 40%; border-radius: 22px; }
.art figcaption { font-size: 12.5px; color: var(--muted); margin-top: 8px; text-align: right; }
.art figcaption a { color: var(--muted); }

.howto {
  display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center;
  border-block: 1px solid var(--line); padding-block: 14px; margin-bottom: 28px; font-size: 15px; color: var(--muted);
}
.howto b { color: var(--ink); }

/* the nine cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 20px 14px; display: flex; flex-direction: column; min-width: 0;
}
.card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.num { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent); }
.draw {
  display: block; width: 120px; height: 86px; flex: none; background: var(--forest);
  -webkit-mask: var(--d) right center / contain no-repeat; mask: var(--d) right center / contain no-repeat;
}
.card h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.2; margin: 10px 0 4px; text-wrap: balance; }
.card p { margin: 0 0 12px; color: var(--muted); font-size: 15.5px; }
.card ul { list-style: none; margin: 0; padding: 0; }
.card li a {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; text-decoration: none;
  padding: 11px 2px; border-top: 1px solid var(--line);
}
.card li a:hover .doc, .card li a:focus-visible .doc { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.card li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.doc { font-weight: 700; flex: 1 1 11em; min-width: 0; }
.doc::after { content: "\00a0↗"; color: var(--accent); font-weight: 800; white-space: nowrap; }
.meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* bear stories: full width, photos */
.card.bears { grid-column: 1 / -1; }
.card.bears ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; margin-top: 4px; }
.card.bears li a { flex-direction: column; align-items: center; gap: 8px; border: 0; padding: 8px 4px; border-radius: 14px; }
.card.bears li a:hover, .card.bears li a:focus-visible { background: var(--cream); }
.card.bears img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--line); }
.card.bears li span { font-weight: 800; text-align: center; }

footer { margin: 40px 0 28px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: grid; gap: 6px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .art { order: -1; }
  .draw { width: 96px; height: 70px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s ease; }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
}

/* passcode page */
.gate { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; gap: clamp(20px, 4vw, 56px); padding-block: 24px; max-width: 1120px; margin: 0 auto; }
.gate > * { min-width: 0; }
.gate .art img { aspect-ratio: 5 / 4; object-position: 50% 60%; }
.gate h1 { font-size: clamp(42px, 7vw, 84px); }
.gate form { margin-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 360px; }
.gate label { font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gate .row { display: flex; gap: 8px; }
.gate input {
  flex: 1 1 auto; width: 0; min-width: 0; font: 600 18px/1.2 var(--body); padding: 13px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
}
.gate input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.gate button {
  font: 800 16px/1 var(--body); padding: 0 20px; border-radius: 12px; border: 0; cursor: pointer;
  background: var(--forest); color: var(--bg);
}
.gate button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate button[disabled] { opacity: .6; cursor: progress; }
.gate .msg { min-height: 1.4em; font-size: 15px; color: var(--accent); margin: 0; }
.gate .hint { font-size: 14px; color: var(--muted); margin: 0; }
.opening { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--forest); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; }
@media (max-width: 760px) { .gate { grid-template-columns: minmax(0, 1fr); min-height: 0; } .gate .art { order: -1; } }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null;
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(bytes) {
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, KEY, bytes.slice(12));
}
async function show() {
  const page = new TextDecoder().decode(await decrypt(b64(PAYLOAD)));
  const app = document.getElementById("app");
  app.innerHTML = page;
  document.getElementById("gate").hidden = true;
  app.hidden = false;
  window.scrollTo(0, 0);
}
async function openDoc(a) {
  const tab = window.open("", "_blank");               // opened during the tap, so it isn't blocked
  const note = document.getElementById("opening");
  note.hidden = false;
  try {
    const res = await fetch("files/" + a.dataset.f);
    const pdf = new Blob([await decrypt(new Uint8Array(await res.arrayBuffer()))], { type: "application/pdf" });
    const url = URL.createObjectURL(pdf);
    if (tab) tab.location = url; else location.href = url;
  } catch (e) {
    if (tab) tab.close();
    alert("Dokumenti nuk u hap. Provo përsëri.");
  } finally { note.hidden = true; }
}
document.getElementById("unlock").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "Duke hapur…";
  try {
    KEY = await deriveKey(document.getElementById("code").value.trim());
    await show();
    msg.textContent = "";
    try { sessionStorage.setItem("th-key", btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", KEY))))); } catch (_) {}
  } catch (_) {
    KEY = null; msg.textContent = "Kodi nuk është i saktë. Provo përsëri.";
    document.getElementById("code").select();
  } finally { btn.disabled = false; }
});
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-f]");
  if (a) { e.preventDefault(); openDoc(a); }
});
(async () => {                                          // stay unlocked when the page is reloaded in the same tab
  try {
    const raw = sessionStorage.getItem("th-key");
    if (raw) { KEY = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", true, ["decrypt"]); await show(); }
  } catch (_) { KEY = null; }
})();
